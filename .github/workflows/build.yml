name: Build and release

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

env:
  PLUGIN_ID: omc-zcode-oauth

jobs:
  test:
    name: Test
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.metadata.outputs.version }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum
      - name: Validate release identity
        id: metadata
        run: |
          set -euo pipefail
          args=()
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            args+=(--tag "${GITHUB_REF_NAME}")
          fi
          VERSION="$(python3 .github/scripts/release_metadata.py "${args[@]}")"
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
          echo "VERSION=${VERSION}" >> "${GITHUB_ENV}"
      - name: Offline release tooling tests
        run: python3 -m unittest discover -s .github/scripts -p 'test_*.py'
      - name: Download modules
        working-directory: go
        run: go mod download
      - name: Offline tests
        working-directory: go
        run: GOPROXY=off GOSUMDB=off go test ./...
      - name: Offline release-linked tests
        working-directory: go
        run: GOPROXY=off GOSUMDB=off go test -ldflags "-X main.pluginVersion=${VERSION}" ./...
      - name: Offline vet
        working-directory: go
        run: GOPROXY=off GOSUMDB=off go vet ./...
      - name: Default build and actual linker drift regressions
        run: GOPROXY=off GOSUMDB=off bash .github/scripts/test-default-build.sh

  build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    needs: test
    runs-on: ${{ matrix.runner }}
    env:
      VERSION: ${{ needs.test.outputs.version }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            runner: ubuntu-24.04
            ext: so
          - goos: linux
            goarch: arm64
            runner: ubuntu-24.04-arm
            ext: so
          - goos: darwin
            goarch: amd64
            runner: macos-15-intel
            ext: dylib
          - goos: darwin
            goarch: arm64
            runner: macos-15
            ext: dylib
          - goos: windows
            goarch: amd64
            runner: ubuntu-24.04
            ext: dll
            zig_target: x86_64-windows-gnu
          - goos: windows
            goarch: arm64
            runner: ubuntu-24.04
            ext: dll
            zig_target: aarch64-windows-gnu
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum
      - name: Resolve release metadata
        run: |
          set -euo pipefail
          args=(--version "${VERSION}")
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            args+=(--tag "${GITHUB_REF_NAME}")
          fi
          python3 .github/scripts/release_metadata.py "${args[@]}"
          echo "ARCHIVE_NAME=${PLUGIN_ID}_${VERSION}_${{ matrix.goos }}_${{ matrix.goarch }}.zip" >> "${GITHUB_ENV}"
      - name: Install Zig for Windows builds
        if: matrix.goos == 'windows'
        shell: bash
        run: |
          set -euo pipefail
          zig_archive="${RUNNER_TEMP}/zig-0.17.0.tar.xz"
          curl -fsSL "https://ziglang.org/download/0.17.0/zig-x86_64-linux-0.17.0.tar.xz" -o "${zig_archive}"
          echo "1cbe9df9f27e6b78d14ccbca43b6703a404ef79ef1c463de901d7f088d4e2026  ${zig_archive}" | sha256sum -c -
          mkdir -p "${RUNNER_TEMP}/zig"
          tar -xJf "${zig_archive}" -C "${RUNNER_TEMP}/zig" --strip-components=1
          echo "${RUNNER_TEMP}/zig" >> "${GITHUB_PATH}"
      - name: Configure Windows C compiler
        if: matrix.goos == 'windows'
        shell: bash
        run: |
          set -euo pipefail
          wrapper="${RUNNER_TEMP}/zigcc/${{ matrix.goarch }}-w64-mingw32-gcc"
          mkdir -p "$(dirname "${wrapper}")"
          cat > "${wrapper}" <<EOF
          #!/bin/sh
          exec zig cc -target ${{ matrix.zig_target }} "\$@"
          EOF
          chmod +x "${wrapper}"
          echo "CC=${wrapper}" >> "${GITHUB_ENV}"
      - name: Download modules
        working-directory: go
        run: go mod download
      - name: Build shared library
        working-directory: go
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          set -euo pipefail
          python3 ../.github/scripts/release_metadata.py --version "${VERSION}" --ldflags "-s -w -X main.pluginVersion=${VERSION}"
          mkdir -p ../dist
          CGO_ENABLED=1 GOPROXY=off GOSUMDB=off go build -trimpath -buildmode=c-shared \
            -ldflags "-s -w -X main.pluginVersion=${VERSION}" \
            -o "../dist/${PLUGIN_ID}.${{ matrix.ext }}" .
          rm -f "../dist/${PLUGIN_ID}.h"
      - name: Native ABI and descriptor smoke test
        if: matrix.goos != 'windows'
        run: python3 .github/scripts/smoke-native.py --library "dist/${PLUGIN_ID}.${{ matrix.ext }}" --version "${VERSION}"
      - name: Package plugin
        run: |
          set -euo pipefail
          python3 .github/scripts/package-release.py \
            --library "dist/${PLUGIN_ID}.${{ matrix.ext }}" \
            --archive "${ARCHIVE_NAME}" \
            --checksum "${ARCHIVE_NAME}.sha256" \
            --descriptor "${PLUGIN_ID}.omc.json" \
            --version "${VERSION}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARCHIVE_NAME }}
          path: |
            ${{ env.ARCHIVE_NAME }}
            ${{ env.ARCHIVE_NAME }}.sha256
          if-no-files-found: error
      - name: Upload public plugin declaration
        if: matrix.goos == 'linux' && matrix.goarch == 'amd64'
        uses: actions/upload-artifact@v4
        with:
          name: plugin-declaration
          path: |
            ${{ env.PLUGIN_ID }}.omc.json
            ${{ env.PLUGIN_ID }}.omc.json.sha256
          if-no-files-found: error

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    concurrency:
      group: plugin-release-${{ github.ref }}
      cancel-in-progress: false
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go/go.mod
          cache: false
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Verify release assets before publishing
        run: python3 .github/scripts/release_metadata.py --tag "${GITHUB_REF_NAME}" --distribution dist
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          python3 .github/scripts/publish_release.py --tag "${GITHUB_REF_NAME}" \
            --repository "${GITHUB_REPOSITORY}" --distribution dist
